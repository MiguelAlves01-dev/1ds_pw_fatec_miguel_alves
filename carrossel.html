<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrossel de Heróis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: #111;
        }

        .carousel-css {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;

            opacity: 0;

            animation: passar 12s infinite;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .s1 {
            animation-delay: 0s;
        }

        .s2 {
            animation-delay: 3s;
        }

        .s3 {
            animation-delay: 6s;
        }

        .s4 {
            animation-delay: 9s;
        }

        @keyframes passar {

            0% {
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            25% {
                opacity: 1;
            }

            30% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }

        .titulo {
            color: white;
        }

    </style>

</head>

<body>

    <div class="container py-5">

        <h1 class="text-center titulo mb-4">
            Heróis da Marvel
        </h1>

        <div class="carousel-css">

            <div class="slide s1">
                <img src="miranha.jpg" alt="Homem-Aranha">
            </div>

            <div class="slide s2">
                <img src="capitao.jpg" alt="Capitão América">
            </div>

            <div class="slide s3">
                <img src="thor.jpeg" alt="Thor">
            </div>

            <div class="slide s4">
                <img src="hulk.png" alt="Hulk">
            </div>

        </div>

    </div>

</body>

</html>
